<!DOCTYPE html>
<html lang="ja">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>シフト連携ダッシュボード</title>
<style>
  :root {
    --bg: #f4f5fa;
    --surface: #ffffff;
    --surface-2: #f8f9fc;
    --text: #151827;
    --muted: #6b7084;
    --line: #e7e8ef;
    --accent: #4f46e5;
    --accent-soft: #eef0ff;
    --accent-text: #ffffff;
    --ok: #0f9f6e;
    --ok-soft: #e5f7f0;
    --warn: #c47a00;
    --warn-soft: #fff4dc;
    --err: #e0364f;
    --err-soft: #fde8ec;
    --shadow: 0 1px 2px rgba(20, 24, 40, .04), 0 8px 24px rgba(20, 24, 40, .06);
    --radius: 16px;
    --sidebar: 236px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1016;
      --surface: #171a23;
      --surface-2: #1d212c;
      --text: #eceef4;
      --muted: #9097ab;
      --line: #2a2f3c;
      --accent: #8b8cff;
      --accent-soft: #23264a;
      --accent-text: #0e1016;
      --ok: #3ccf96;
      --ok-soft: #13342a;
      --warn: #f0b443;
      --warn-soft: #3a2e14;
      --err: #ff6b81;
      --err-soft: #3d1a22;
      --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font-family: "Inter", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", system-ui, -apple-system, sans-serif;
    font-size: 15px; line-height: 1.55; -webkit-font-smoothing: antialiased;
  }
  button, input, select { font: inherit; color: inherit; }
  svg { width: 20px; height: 20px; flex: none; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  /* ---------- レイアウト ---------- */
  .app { min-height: 100vh; }
  .sidebar {
    position: fixed; inset: 0 auto 0 0; width: var(--sidebar); padding: 20px 14px;
    background: var(--surface); border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 4px;
  }
  .brand { display: flex; align-items: center; gap: 10px; padding: 6px 10px 18px; font-weight: 700; letter-spacing: .01em; }
  .brand-mark {
    width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center;
    background: linear-gradient(135deg, #6366f1, #22c1c3); color: #fff;
  }
  .brand-mark svg { width: 18px; height: 18px; }
  .brand small { display: block; font-weight: 500; color: var(--muted); font-size: 12px; }
  .nav-btn {
    display: flex; align-items: center; gap: 12px; width: 100%; padding: 10px 12px; border: 0; border-radius: 10px;
    background: transparent; color: var(--muted); cursor: pointer; text-align: left; font-weight: 500;
  }
  .nav-btn:hover { background: var(--surface-2); color: var(--text); }
  .nav-btn.active { background: var(--accent-soft); color: var(--accent); }
  .nav-btn .count { margin-left: auto; font-size: 12px; background: var(--err); color: #fff; border-radius: 999px; padding: 0 7px; }
  .sidebar-foot { margin-top: auto; padding: 12px; font-size: 12px; color: var(--muted); }

  main { margin-left: var(--sidebar); padding: 24px 32px 48px; max-width: calc(1180px + var(--sidebar)); }
  .topbar { display: flex; align-items: center; gap: 16px; margin-bottom: 22px; flex-wrap: wrap; }
  .topbar h1 { margin: 0; font-size: 24px; letter-spacing: -.01em; }
  .topbar .sub { color: var(--muted); font-size: 13px; display: flex; align-items: center; gap: 8px; }
  .topbar .actions { margin-left: auto; display: flex; gap: 8px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 4px var(--ok-soft); }
  .dot.off { background: var(--muted); box-shadow: none; }

  .tabbar { display: none; }

  /* ---------- 部品 ---------- */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 40px; padding: 0 16px;
    border-radius: 10px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 600;
    white-space: nowrap; transition: transform .05s ease, background .15s ease;
  }
  .btn:hover { background: var(--surface-2); }
  .btn:active { transform: translateY(1px); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  .btn.primary:hover { filter: brightness(1.06); }
  .btn.small { height: 34px; padding: 0 12px; font-size: 14px; }
  .btn:disabled { opacity: .55; cursor: default; }
  .btn svg { width: 18px; height: 18px; }
  .spin svg, svg.spin { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .grid { display: grid; gap: 16px; }
  .stats { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .two { grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); align-items: start; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
  .card-pad { padding: 20px; }
  .card-head { display: flex; align-items: center; gap: 10px; padding: 16px 20px; border-bottom: 1px solid var(--line); }
  .card-head h2 { margin: 0; font-size: 16px; }
  .card-head .link { margin-left: auto; }
  .link { background: none; border: 0; color: var(--accent); cursor: pointer; font-weight: 600; font-size: 14px; padding: 0; }

  .stat { padding: 18px 20px; display: flex; flex-direction: column; gap: 6px; min-height: 126px; }
  .stat-top { display: flex; align-items: center; justify-content: space-between; color: var(--muted); font-size: 13px; font-weight: 600; }
  .stat-icon { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; }
  .stat-icon svg { width: 18px; height: 18px; }
  .stat-value { font-size: 30px; font-weight: 700; letter-spacing: -.02em; line-height: 1.1; }
  .stat-value small { font-size: 16px; color: var(--muted); font-weight: 600; }
  .stat-note { font-size: 12px; color: var(--muted); }
  .bar { height: 6px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
  .bar > i { display: block; height: 100%; background: linear-gradient(90deg, #6366f1, #22c1c3); border-radius: inherit; }
  .tone-accent { background: var(--accent-soft); color: var(--accent); }
  .tone-ok { background: var(--ok-soft); color: var(--ok); }
  .tone-warn { background: var(--warn-soft); color: var(--warn); }
  .tone-err { background: var(--err-soft); color: var(--err); }

  .badge {
    display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 9px; border-radius: 999px;
    font-size: 12px; font-weight: 600; white-space: nowrap;
  }
  .badge svg { width: 13px; height: 13px; stroke-width: 2.5; }
  .badge.muted { background: var(--surface-2); color: var(--muted); }

  .list { list-style: none; margin: 0; padding: 0; }
  .list > li { display: flex; align-items: center; gap: 14px; padding: 14px 20px; border-top: 1px solid var(--line); }
  .list > li:first-child { border-top: 0; }
  .empty { padding: 32px 20px; text-align: center; color: var(--muted); }

  .checklist li { align-items: flex-start; }
  .check-icon { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; flex: none; margin-top: 1px; }
  .check-icon svg { width: 15px; height: 15px; stroke-width: 3; }
  .grow { flex: 1; min-width: 0; }
  .title { font-weight: 600; }
  .muted { color: var(--muted); font-size: 13px; }
  .ellipsis { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .day-head {
    padding: 10px 20px; font-size: 13px; font-weight: 700; color: var(--muted); background: var(--surface-2);
    border-top: 1px solid var(--line); position: sticky; top: 0; z-index: 1;
  }
  .day-head:first-child { border-top: 0; border-radius: var(--radius) var(--radius) 0 0; }
  .time { font-variant-numeric: tabular-nums; font-weight: 700; min-width: 108px; }
  .badges { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }

  .avatar {
    width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; flex: none;
    font-weight: 700; color: #fff; font-size: 15px;
  }

  .toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
  .search { position: relative; flex: 1; min-width: 200px; max-width: 360px; }
  .search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 17px; height: 17px; color: var(--muted); }
  .search input { padding-left: 38px; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip {
    height: 34px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface);
    cursor: pointer; font-weight: 600; font-size: 13px; color: var(--muted);
  }
  .chip.active { background: var(--text); color: var(--surface); border-color: var(--text); }

  .input, select.input {
    width: 100%; height: 42px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--surface); outline: none; transition: border-color .15s, box-shadow .15s;
  }
  .input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
  .field { display: grid; gap: 6px; }
  .field label { font-size: 13px; font-weight: 600; }
  .field .hint { font-size: 12px; color: var(--muted); }
  .inline { display: flex; gap: 8px; align-items: center; }
  .segmented { display: inline-flex; padding: 4px; gap: 4px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--line); }
  .segmented button { border: 0; background: transparent; height: 34px; padding: 0 14px; border-radius: 8px; font-weight: 600; color: var(--muted); cursor: pointer; }
  .segmented button.active { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }
  .form { display: grid; gap: 18px; }
  .section-title { font-size: 13px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin: 4px 0 -6px; }
  .preview { padding: 12px 14px; border-radius: 12px; background: var(--surface-2); border: 1px dashed var(--line); display: flex; gap: 10px; align-items: center; }
  .preview .bar-mini { width: 4px; align-self: stretch; border-radius: 4px; background: var(--accent); }

  details.help { border-top: 1px solid var(--line); }
  details.help summary { padding: 14px 20px; cursor: pointer; font-weight: 600; list-style: none; display: flex; gap: 10px; align-items: center; }
  details.help summary::-webkit-details-marker { display: none; }
  details.help ol { margin: 0; padding: 0 20px 18px 42px; color: var(--muted); font-size: 14px; }
  details.help ol li { margin: 4px 0; }
  details.help b { color: var(--text); }

  .log-text { white-space: pre-wrap; word-break: break-word; font-size: 13px; }

  .toast-wrap { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); display: grid; gap: 8px; z-index: 50; width: min(92vw, 440px); }
  .toast {
    display: flex; gap: 10px; align-items: flex-start; padding: 12px 16px; border-radius: 12px; background: var(--text); color: var(--surface);
    box-shadow: 0 10px 30px rgba(0,0,0,.2); font-size: 14px; animation: rise .2s ease; white-space: pre-wrap;
  }
  .toast.err { background: var(--err); color: #fff; }
  @keyframes rise { from { transform: translateY(8px); opacity: 0; } }

  .skeleton { border-radius: 10px; background: linear-gradient(90deg, var(--surface-2), var(--line), var(--surface-2)); background-size: 200% 100%; animation: shimmer 1.2s infinite; }
  @keyframes shimmer { to { background-position: -200% 0; } }

  /* ---------- スマホ ---------- */
  @media (max-width: 900px) {
    .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .two { grid-template-columns: minmax(0, 1fr); }
  }
  @media (max-width: 760px) {
    .sidebar { display: none; }
    main { margin-left: 0; padding: 16px 16px calc(96px + env(safe-area-inset-bottom)); }
    .topbar { margin-bottom: 16px; }
    .topbar h1 { font-size: 21px; }
    .topbar .actions { margin-left: 0; width: 100%; }
    .topbar .actions .btn { flex: 1; }
    .stat { min-height: 112px; padding: 14px 16px; }
    .stat-value { font-size: 26px; }
    .list > li { padding: 13px 16px; }
    .card-head { padding: 14px 16px; }
    .card-pad { padding: 16px; }
    .day-head { padding: 9px 16px; }
    .time { min-width: 0; }
    .shift-row { flex-wrap: wrap; }
    .shift-row .badges { width: 100%; justify-content: flex-start; }
    .staff-row { flex-wrap: wrap; }
    .staff-row .staff-edit { width: 100%; }
    .search { max-width: none; }
    .tabbar {
      display: grid; grid-template-columns: repeat(5, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
      background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      border-top: 1px solid var(--line); padding: 6px 4px calc(6px + env(safe-area-inset-bottom));
    }
    .tabbar button {
      border: 0; background: transparent; display: grid; justify-items: center; gap: 2px; padding: 6px 0; font-size: 11px;
      font-weight: 600; color: var(--muted); cursor: pointer; position: relative;
    }
    .tabbar button.active { color: var(--accent); }
    .tabbar .count { position: absolute; top: 2px; left: calc(50% + 6px); background: var(--err); color: #fff; font-size: 10px; border-radius: 999px; padding: 0 5px; }
    .toast-wrap { bottom: calc(88px + env(safe-area-inset-bottom)); }
  }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18M9 16l2 2 4-4"/></svg></div>
      <div>シフト連携<small>Square → Google</small></div>
    </div>
    <div id="side-nav"></div>
    <div class="sidebar-foot" id="side-foot"></div>
  </aside>

  <main>
    <header class="topbar">
      <div>
        <h1 id="page-title">概要</h1>
        <div class="sub" id="page-sub"><span class="dot off"></span>読み込み中…</div>
      </div>
      <div class="actions">
        <button class="btn" data-action="reload" id="btn-reload">
          <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          <span>Squareから読み込み</span>
        </button>
        <button class="btn primary" data-action="sync" id="btn-sync">
          <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
          <span>今すぐ同期</span>
        </button>
      </div>
    </header>
    <div id="view"></div>
  </main>

  <nav class="tabbar" id="tabbar"></nav>
</div>
<div class="toast-wrap" id="toasts"></div>

<script>
  // ================= 状態 =================
  var state = { data: null, view: 'overview', busy: null, shiftFilter: 'all', staffQuery: '', staffFilter: 'all', titleDraft: null };

  var ICONS = {
    overview: '<svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>',
    shifts: '<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>',
    staff: '<svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>',
    stores: '<svg viewBox="0 0 24 24"><path d="M3 9l1.5-5h15L21 9"/><path d="M3 9h18v2a3 3 0 0 1-6 0 3 3 0 0 1-6 0 3 3 0 0 1-6 0V9z"/><path d="M5 13v8h14v-8"/></svg>',
    settings: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>',
    logs: '<svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>',
    check: '<svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg>',
    alert: '<svg viewBox="0 0 24 24"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>',
    mail: '<svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M22 6l-10 7L2 6"/></svg>',
    minus: '<svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg>',
    x: '<svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>',
    search: '<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>',
    clock: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
    link: '<svg viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg>',
    spinner: '<svg viewBox="0 0 24 24" class="spin"><path d="M21 12a9 9 0 1 1-6.2-8.56"/></svg>',
  };

  var VIEWS = [
    { id: 'overview', label: '概要', title: '概要' },
    { id: 'shifts', label: 'シフト', title: '今後のシフト' },
    { id: 'staff', label: 'スタッフ', title: 'スタッフ' },
    { id: 'stores', label: '店舗', title: '店舗カレンダー' },
    { id: 'settings', label: '設定', title: '設定' },
    { id: 'logs', label: 'ログ', title: '同期ログ', desktopOnly: true },
  ];

  // ================= サーバー呼び出し =================
  function call(name) {
    var args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (resolve, reject) {
      var runner = google.script.run.withSuccessHandler(resolve).withFailureHandler(function (e) {
        reject(e && e.message ? e : new Error(String(e)));
      });
      runner[name].apply(runner, args);
    });
  }

  function run(kind, promise, okMessage) {
    state.busy = kind;
    renderChrome();
    return promise.then(function (res) {
      if (res && res.data) {
        state.data = res.data;
        if (res.message) toast(res.message.split('\n')[0], /エラー[1-9]/.test(res.message));
      } else if (res) {
        state.data = res;
        if (okMessage) toast(okMessage);
      }
    }).catch(function (e) {
      toast(e.message || String(e), true);
    }).then(function () {
      state.busy = null;
      render();
    });
  }

  // ================= 共通 =================
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function toast(msg, isErr) {
    var el = document.createElement('div');
    el.className = 'toast' + (isErr ? ' err' : '');
    el.innerHTML = (isErr ? ICONS.alert : ICONS.check) + '<div>' + esc(msg) + '</div>';
    document.getElementById('toasts').appendChild(el);
    setTimeout(function () { el.remove(); }, isErr ? 7000 : 3500);
  }
  function tz() { return (state.data && state.data.timeZone) || 'Asia/Tokyo'; }
  function fmtDay(iso) {
    return new Date(iso).toLocaleDateString('ja-JP', { timeZone: tz(), month: 'numeric', day: 'numeric', weekday: 'short' });
  }
  function fmtTime(iso) {
    return iso ? new Date(iso).toLocaleTimeString('ja-JP', { timeZone: tz(), hour: '2-digit', minute: '2-digit' }) : '';
  }
  function dayKey(iso) {
    return new Date(iso).toLocaleDateString('sv-SE', { timeZone: tz() });
  }
  function relativeDay(iso) {
    var today = dayKey(new Date().toISOString());
    var tomorrow = dayKey(new Date(Date.now() + 86400000).toISOString());
    var k = dayKey(iso);
    return k === today ? '今日' : k === tomorrow ? '明日' : '';
  }
  var PALETTE = ['#6366f1', '#0ea5e9', '#14b8a6', '#f59e0b', '#ef4444', '#8b5cf6', '#ec4899', '#22c55e'];
  function avatar(name, id) {
    var h = 0;
    String(id || name).split('').forEach(function (c) { h = (h * 31 + c.charCodeAt(0)) >>> 0; });
    var initial = String(name || '?').replace(/\s+/g, '').slice(0, 1);
    return '<div class="avatar" style="background:' + PALETTE[h % PALETTE.length] + '">' + esc(initial) + '</div>';
  }
  function badge(tone, icon, text) {
    return '<span class="badge tone-' + tone + '">' + (ICONS[icon] || '') + esc(text) + '</span>';
  }
  function needsAttention() {
    var s = state.data && state.data.stats;
    if (!s) return 0;
    return s.errors + s.staffNone + s.storesUnset + (state.data.settings.tokenSet ? 0 : 1);
  }
  function go(view) {
    state.view = view;
    render();
    window.scrollTo(0, 0);
  }

  // ================= 画面の枠 =================
  function renderChrome() {
    var attention = needsAttention();
    var nav = VIEWS.map(function (v) {
      var count = v.id === 'overview' && attention ? '<span class="count">' + attention + '</span>' : '';
      return '<button class="nav-btn' + (state.view === v.id ? ' active' : '') + '" data-go="' + v.id + '">' + ICONS[v.id] + v.label + count + '</button>';
    }).join('');
    document.getElementById('side-nav').innerHTML = nav;
    document.getElementById('tabbar').innerHTML = VIEWS.filter(function (v) { return !v.desktopOnly; }).map(function (v) {
      var count = v.id === 'overview' && attention ? '<span class="count">' + attention + '</span>' : '';
      return '<button class="' + (state.view === v.id ? 'active' : '') + '" data-go="' + v.id + '">' + ICONS[v.id] + v.label + count + '</button>';
    }).join('');

    var view = VIEWS.filter(function (v) { return v.id === state.view; })[0];
    document.getElementById('page-title').textContent = view.title;

    var d = state.data;
    var sub = document.getElementById('page-sub');
    if (d) {
      var on = d.settings.autoSync;
      sub.innerHTML = '<span class="dot' + (on ? '' : ' off') + '"></span>' +
        (on ? d.settings.everyMinutes + '分ごとに自動同期中' : '自動同期は停止中') +
        (d.settings.lastSync ? '<span>・</span><span class="ellipsis">最終 ' + esc(d.settings.lastSync.split('  ')[0]) + '</span>' : '');
      document.getElementById('side-foot').innerHTML = d.spreadsheetUrl
        ? '<a class="link" href="' + esc(d.spreadsheetUrl) + '" target="_blank">' + 'スプレッドシートを開く</a>' : '';
    }

    var sync = document.getElementById('btn-sync');
    var reload = document.getElementById('btn-reload');
    sync.disabled = reload.disabled = !!state.busy || !d;
    sync.classList.toggle('spin', state.busy === 'sync');
    reload.classList.toggle('spin', state.busy === 'reload');
    sync.querySelector('span').textContent = state.busy === 'sync' ? '同期中…' : '今すぐ同期';
  }

  function render() {
    renderChrome();
    var el = document.getElementById('view');
    if (!state.data) { el.innerHTML = skeleton(); return; }
    var fn = { overview: viewOverview, shifts: viewShifts, staff: viewStaff, stores: viewStores, settings: viewSettings, logs: viewLogs }[state.view];
    el.innerHTML = fn(state.data);
  }

  function skeleton() {
    var card = '<div class="card stat"><div class="skeleton" style="height:14px;width:60%"></div><div class="skeleton" style="height:30px;width:40%;margin-top:8px"></div></div>';
    return '<div class="grid stats">' + card + card + card + card + '</div>' +
      '<div class="card" style="margin-top:16px;padding:20px"><div class="skeleton" style="height:16px;width:30%"></div>' +
      '<div class="skeleton" style="height:48px;margin-top:16px"></div><div class="skeleton" style="height:48px;margin-top:10px"></div></div>';
  }

  // ================= 概要 =================
  function viewOverview(d) {
    var s = d.stats;
    var pct = s.staffTotal ? Math.round(s.staffDirect / s.staffTotal * 100) : 0;
    var attention = needsAttention();
    var stats =
      statCard('今後のシフト', s.upcoming + '<small> 件</small>', d.settings.days + '日先まで反映', 'accent', 'shifts') +
      statCard('本人カレンダー', s.staffDirect + '<small> / ' + s.staffTotal + '人</small>', '<div class="bar"><i style="width:' + pct + '%"></i></div>', 'ok', 'staff') +
      statCard('招待で送信', s.staffInvite + '<small> 人</small>', 'カレンダー共有がまだのスタッフ', 'warn', 'mail') +
      statCard('要対応', attention + '<small> 件</small>', attention ? '下の「セットアップ」を確認' : 'すべて正常です', attention ? 'err' : 'ok', attention ? 'alert' : 'check');

    var upcoming = d.shifts.slice(0, 6);
    var upcomingHtml = upcoming.length
      ? '<ul class="list">' + upcoming.map(shiftRow).join('') + '</ul>'
      : '<div class="empty">今後のシフトはまだありません。<br>Squareでシフトを公開して「今すぐ同期」を押してください。</div>';

    var logs = d.logs.slice(0, 5);
    var logsHtml = logs.length ? '<ul class="list">' + logs.map(logRow).join('') + '</ul>' : '<div class="empty">まだ同期していません</div>';

    return '<div class="grid stats">' + stats + '</div>' +
      '<div class="grid two" style="margin-top:16px">' +
        '<div class="grid">' +
          setupCard(d) +
          '<div class="card"><div class="card-head">' + ICONS.shifts + '<h2>直近のシフト</h2><button class="link" data-go="shifts">すべて見る</button></div>' + upcomingHtml + '</div>' +
        '</div>' +
        '<div class="card"><div class="card-head">' + ICONS.logs + '<h2>最近の同期</h2><button class="link" data-go="logs">すべて見る</button></div>' + logsHtml + '</div>' +
      '</div>';
  }

  function statCard(label, value, note, tone, icon) {
    return '<div class="card stat"><div class="stat-top">' + esc(label) +
      '<span class="stat-icon tone-' + tone + '">' + ICONS[icon] + '</span></div>' +
      '<div class="stat-value">' + value + '</div><div class="stat-note">' + note + '</div></div>';
  }

  function setupCard(d) {
    var s = d.stats;
    var items = [
      { ok: d.settings.tokenSet, title: 'Squareのアクセストークン', text: d.settings.tokenSet ? '登録済み' : '「設定」から登録してください', go: 'settings' },
      { ok: s.storesUnset === 0 && d.stores.length > 0, title: '店舗ごとのカレンダー', text: d.stores.length ? (s.storesUnset ? s.storesUnset + '店舗が未選択（既定のカレンダーに入ります）' : 'すべて選択済み') : '店舗がまだ読み込まれていません', go: 'stores' },
      { ok: s.staffTotal > 0 && s.staffDirect === s.staffTotal, title: 'スタッフのカレンダー共有', text: s.staffTotal ? s.staffDirect + ' / ' + s.staffTotal + '人が直接書き込み' + (s.staffNone ? '・' + s.staffNone + '人は送信先なし' : '') : 'スタッフがまだ読み込まれていません', go: 'staff' },
      { ok: d.settings.autoSync, title: '自動同期', text: d.settings.autoSync ? d.settings.everyMinutes + '分ごとに実行中' : 'Apps Scriptで setup を実行してください' },
    ];
    var done = items.filter(function (i) { return i.ok; }).length;
    if (done === items.length) return '';
    return '<div class="card"><div class="card-head">' + ICONS.alert + '<h2>セットアップ</h2><span class="muted" style="margin-left:auto">' + done + ' / ' + items.length + ' 完了</span></div>' +
      '<ul class="list checklist">' + items.map(function (i) {
        return '<li><span class="check-icon ' + (i.ok ? 'tone-ok' : 'tone-warn') + '">' + (i.ok ? ICONS.check : ICONS.minus) + '</span>' +
          '<div class="grow"><div class="title">' + esc(i.title) + '</div><div class="muted">' + esc(i.text) + '</div></div>' +
          (i.go && !i.ok ? '<button class="btn small" data-go="' + i.go + '">設定する</button>' : '') + '</li>';
      }).join('') + '</ul></div>';
  }

  // ================= シフト =================
  function targetBadge(t, kind) {
    if (!t) return badge('muted', 'minus', kind === 'store' ? '店舗 なし' : '本人 なし').replace('tone-muted', 'muted');
    if (t.status === 'error') return badge('err', 'alert', (kind === 'store' ? '店舗' : '本人') + ' エラー');
    if (t.status === 'deleted') return '<span class="badge muted">' + ICONS.minus + (kind === 'store' ? '店舗' : '本人') + ' なし</span>';
    if (kind === 'store' && t.guests) return badge('warn', 'mail', '店舗 ＋ 招待');
    return badge('ok', 'check', kind === 'store' ? '店舗' : '本人');
  }
  function shiftHasProblem(x) {
    return (x.store && x.store.status === 'error') || (x.staff && x.staff.status === 'error') ||
      ((!x.staff || x.staff.status !== 'synced') && !(x.store && x.store.guests));
  }
  function shiftRow(x) {
    var rel = relativeDay(x.start);
    var note = [x.store && x.store.status === 'error' ? x.store.note : '', x.staff && x.staff.status === 'error' ? x.staff.note : '']
      .filter(Boolean).join(' / ');
    return '<li class="shift-row">' +
      '<div class="time">' + (state.view === 'overview' ? '<div class="muted">' + (rel || fmtDay(x.start)) + '</div>' : '') +
        esc(fmtTime(x.start)) + (x.end ? '<span class="muted"> – ' + esc(fmtTime(x.end)) + '</span>' : '') + '</div>' +
      '<div class="grow"><div class="title ellipsis">' + esc(x.name || '（不明）') + '</div>' +
        '<div class="muted ellipsis">' + esc(x.location || '店舗未設定') + (note ? ' ・ <span style="color:var(--err)">' + esc(note) + '</span>' : '') + '</div></div>' +
      '<div class="badges">' + targetBadge(x.store, 'store') + targetBadge(x.staff, 'staff') + '</div></li>';
  }

  function viewShifts(d) {
    var list = d.shifts.filter(function (x) { return state.shiftFilter === 'all' || shiftHasProblem(x); });
    var chips = '<div class="chips">' +
      chip('shiftFilter', 'all', 'すべて（' + d.shifts.length + '）') +
      chip('shiftFilter', 'problem', '要確認（' + d.shifts.filter(shiftHasProblem).length + '）') + '</div>';
    if (!list.length) return '<div class="toolbar">' + chips + '</div><div class="card"><div class="empty">該当するシフトはありません</div></div>';
    var html = '';
    var last = '';
    list.forEach(function (x) {
      var k = dayKey(x.start);
      if (k !== last) {
        if (last) html += '</ul>';
        var rel = relativeDay(x.start);
        html += '<div class="day-head">' + esc(fmtDay(x.start)) + (rel ? '　' + rel : '') + '</div><ul class="list">';
        last = k;
      }
      html += shiftRow(x);
    });
    html += '</ul>';
    return '<div class="toolbar">' + chips + '<span class="muted" style="margin-left:auto">本人＝スタッフのカレンダー ／ 店舗＝店舗カレンダー</span></div><div class="card">' + html + '</div>';
  }

  function chip(key, value, label) {
    return '<button class="chip' + (state[key] === value ? ' active' : '') + '" data-chip="' + key + '" data-value="' + value + '">' + esc(label) + '</button>';
  }

  // ================= スタッフ =================
  function staffBadge(m) {
    if (m.level === 'ok') return badge('ok', 'check', '直接書き込み');
    if (m.level === 'error') return badge('err', 'x', '送信先なし');
    if (/予定の変更/.test(m.status)) return badge('warn', 'alert', '権限が閲覧のみ');
    if (m.level === 'warn') return badge('warn', 'mail', '招待で送信');
    return '<span class="badge muted">未同期</span>';
  }

  function viewStaff(d) {
    var q = state.staffQuery.trim().toLowerCase();
    var list = d.staff.filter(function (m) {
      var hit = !q || (m.name + ' ' + m.squareEmail + ' ' + m.calendar).toLowerCase().indexOf(q) >= 0;
      var f = state.staffFilter;
      return hit && (f === 'all' || (f === 'ok' && m.level === 'ok') || (f === 'todo' && m.level !== 'ok'));
    });
    var toolbar = '<div class="toolbar"><div class="search">' + ICONS.search +
      '<input class="input" id="staff-search" placeholder="名前・メールで検索" value="' + esc(state.staffQuery) + '"></div>' +
      '<div class="chips">' + chip('staffFilter', 'all', 'すべて') + chip('staffFilter', 'ok', '直接書き込み') + chip('staffFilter', 'todo', '要対応') + '</div></div>';

    var rows = list.length ? '<ul class="list">' + list.map(function (m) {
      return '<li class="staff-row">' + avatar(m.name, m.id) +
        '<div class="grow"><div class="title">' + esc(m.name) + '</div><div class="muted ellipsis">Square: ' + esc(m.squareEmail || '未登録') + '</div></div>' +
        staffBadge(m) +
        '<form class="inline staff-edit" data-form="staff" data-id="' + esc(m.id) + '" style="min-width:min(100%,360px)">' +
          '<input class="input" type="email" name="email" value="' + esc(m.calendar) + '" placeholder="本人カレンダーのGmail" aria-label="本人カレンダーのGmail">' +
          '<button class="btn small" type="submit">保存</button></form></li>';
    }).join('') + '</ul>' : '<div class="empty">' + (d.staff.length ? '該当するスタッフはいません' : 'スタッフがまだ読み込まれていません。上の「Squareから読み込み」を押してください') + '</div>';

    var help = '<details class="help"><summary>' + ICONS.link + 'スタッフのカレンダーを共有する方法</summary><ol>' +
      '<li>スタッフのGmailアカウントで、パソコン（またはスマホのChromeの「PC版サイト」）から <b>Googleカレンダー</b> を開く</li>' +
      '<li>右上の ⚙ →「設定」→ 左の「マイカレンダーの設定」で自分の名前を選ぶ</li>' +
      '<li>「特定のユーザーまたはグループと共有する」→「ユーザーやグループを追加」</li>' +
      '<li>このダッシュボードを使っている<b>会社アカウントのメールアドレス</b>を入れ、権限を<b>「予定の変更」</b>にして送信</li>' +
      '<li>次の同期から、自動で「直接書き込み」に切り替わります</li></ol></details>';

    return toolbar + '<div class="card">' + rows + help + '</div>';
  }

  // ================= 店舗 =================
  function calendarSelect(name, current, includeDefault) {
    var opts = (includeDefault ? '<option value="">既定のカレンダー</option>' : '<option value="">メインカレンダー</option>') +
      state.data.calendarOptions.map(function (c) {
        return '<option value="' + esc(c) + '"' + (c === current ? ' selected' : '') + '>' + esc(c) + '</option>';
      }).join('');
    if (current && state.data.calendarOptions.indexOf(current) < 0) opts += '<option value="' + esc(current) + '" selected>' + esc(current) + '（見つかりません）</option>';
    return '<select class="input" name="' + name + '">' + opts + '</select>';
  }

  function viewStores(d) {
    if (!d.stores.length) return '<div class="card"><div class="empty">店舗がまだ読み込まれていません。上の「Squareから読み込み」を押してください</div></div>';
    return '<p class="muted" style="margin:-6px 0 14px">会社アカウントのカレンダー（「カレンダーを追加」で作ったもの）から、店舗ごとの書き込み先を選びます。</p>' +
      '<div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(280px,1fr))">' + d.stores.map(function (st) {
        var tone = st.calendar === '（書き込まない）' ? 'muted' : st.calendar ? 'ok' : 'warn';
        var label = st.calendar === '（書き込まない）' ? '書き込まない' : st.calendar ? '設定済み' : '既定を使用';
        return '<form class="card card-pad" data-form="store" data-id="' + esc(st.id) + '" style="display:grid;gap:14px">' +
          '<div class="inline"><span class="stat-icon tone-accent">' + ICONS.stores + '</span><div class="grow"><div class="title">' + esc(st.name) + '</div>' +
          '<div class="muted ellipsis">' + esc(st.id) + '</div></div>' +
          (tone === 'muted' ? '<span class="badge muted">' + label + '</span>' : badge(tone, tone === 'ok' ? 'check' : 'minus', label)) + '</div>' +
          '<div class="inline">' + calendarSelect('calendar', st.calendar, true) + '<button class="btn small" type="submit">保存</button></div></form>';
      }).join('') + '</div>';
  }

  // ================= 設定 =================
  function previewTitle(tpl) {
    var name = (state.data.staff[0] && state.data.staff[0].name) || '山田 花子';
    var store = (state.data.stores[0] && state.data.stores[0].name) || '渋谷店';
    return (tpl || '').replace(/\{name\}/g, name).replace(/\{location\}/g, store).replace(/\{job\}/g, 'ホール').replace(/[\s\/／・]+$/, '') || name;
  }

  function viewSettings(d) {
    var s = d.settings;
    var title = state.titleDraft != null ? state.titleDraft : s.title;
    return '<form class="card card-pad form" data-form="settings" style="max-width:720px">' +
      '<div class="section-title">Square</div>' +
      '<div class="field"><label for="token">アクセストークン</label>' +
        '<input class="input" id="token" name="token" type="password" autocomplete="off" placeholder="' + (s.tokenSet ? '登録済み（変更するときだけ入力）' : 'EAAA… を貼り付け') + '">' +
        '<div class="hint">Square Developer Dashboard → アプリ → Credentials →「Production」の Access token</div></div>' +
      '<div class="field"><label>環境</label><div class="segmented" data-segment="env">' +
        ['本番', 'サンドボックス'].map(function (v) { return '<button type="button" class="' + (s.env === v ? 'active' : '') + '" data-value="' + v + '">' + v + '</button>'; }).join('') +
        '</div><input type="hidden" name="env" value="' + esc(s.env) + '"></div>' +

      '<div class="section-title">カレンダー</div>' +
      '<div class="field"><label for="title">予定タイトル</label>' +
        '<input class="input" id="title" name="title" value="' + esc(title) + '">' +
        '<div class="hint">{name}＝氏名　{location}＝店舗名　{job}＝職種</div>' +
        '<div class="preview"><span class="bar-mini"></span><div><div class="title" id="title-preview">' + esc(previewTitle(title)) + '</div><div class="muted">カレンダーでの表示例</div></div></div></div>' +
      '<div class="field"><label>既定の店舗カレンダー</label>' + calendarSelect('defaultCal', s.defaultCal, false) +
        '<div class="hint">「店舗」で書き込み先を選んでいない店舗のシフトが入ります</div></div>' +
      '<div class="field"><label for="days">同期する日数</label>' +
        '<div class="inline" style="max-width:220px"><input class="input" id="days" name="days" type="number" min="1" max="180" value="' + esc(s.days) + '"><span class="muted">日先まで</span></div></div>' +

      '<div class="inline" style="justify-content:flex-end;gap:10px;border-top:1px solid var(--line);padding-top:18px">' +
        '<button class="btn primary" type="submit">' + ICONS.check + '<span>保存</span></button></div>' +
      '</form>';
  }

  // ================= ログ =================
  function logRow(l) {
    var lines = l.text.split('\n');
    return '<li style="align-items:flex-start"><span class="check-icon ' + (l.error ? 'tone-err' : 'tone-ok') + '">' + (l.error ? ICONS.alert : ICONS.check) + '</span>' +
      '<div class="grow"><div class="inline" style="gap:8px"><span class="title">' + esc(l.at) + '</span><span class="badge muted">' + esc(l.trigger) + '</span></div>' +
      '<div class="log-text muted">' + esc(lines[0]) + '</div>' +
      (lines.length > 1 ? '<div class="log-text" style="color:var(--err)">' + esc(lines.slice(1).join('\n')) + '</div>' : '') + '</div></li>';
  }
  function viewLogs(d) {
    return '<div class="card">' + (d.logs.length ? '<ul class="list">' + d.logs.map(logRow).join('') + '</ul>' : '<div class="empty">まだ同期していません</div>') + '</div>';
  }

  // ================= 操作 =================
  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-go],[data-action],[data-chip],[data-segment] button');
    if (!t) return;
    if (t.dataset.go) return go(t.dataset.go);
    if (t.dataset.chip) { state[t.dataset.chip] = t.dataset.value; return render(); }
    if (t.closest('[data-segment]')) {
      var seg = t.closest('[data-segment]');
      seg.querySelectorAll('button').forEach(function (b) { b.classList.toggle('active', b === t); });
      seg.parentNode.querySelector('input[name="' + seg.dataset.segment + '"]').value = t.dataset.value;
      return;
    }
    if (t.dataset.action === 'sync') return run('sync', call('dashboardSync'));
    if (t.dataset.action === 'reload') return run('reload', call('dashboardReload'), 'Squareからスタッフと店舗を読み込みました');
  });

  document.addEventListener('submit', function (e) {
    var f = e.target.closest('form[data-form]');
    if (!f) return;
    e.preventDefault();
    var btn = f.querySelector('button[type=submit]');
    if (btn) { btn.disabled = true; btn.insertAdjacentHTML('afterbegin', ICONS.spinner); }
    var fd = new FormData(f);
    if (f.dataset.form === 'staff') return run('save', call('dashboardSaveStaff', f.dataset.id, fd.get('email')), '保存しました（次の同期から反映）');
    if (f.dataset.form === 'store') return run('save', call('dashboardSaveStore', f.dataset.id, fd.get('calendar')), '保存しました（次の同期から反映）');
    if (f.dataset.form === 'settings') {
      state.titleDraft = null;
      return run('save', call('dashboardSaveSettings', {
        token: fd.get('token'), env: fd.get('env'), days: fd.get('days'), title: fd.get('title'), defaultCal: fd.get('defaultCal'),
      }), '設定を保存しました');
    }
  });

  document.addEventListener('input', function (e) {
    if (e.target.id === 'staff-search') {
      state.staffQuery = e.target.value;
      var pos = e.target.selectionStart;
      render();
      var input = document.getElementById('staff-search');
      input.focus();
      input.setSelectionRange(pos, pos);
    }
    if (e.target.id === 'title') {
      state.titleDraft = e.target.value;
      document.getElementById('title-preview').textContent = previewTitle(e.target.value);
    }
  });

  // ================= 起動 =================
  render();
  call('dashboardData').then(function (d) { state.data = d; render(); }).catch(function (e) {
    toast(e.message || String(e), true);
    document.getElementById('view').innerHTML = '<div class="card"><div class="empty">読み込めませんでした：' + esc(e.message || e) + '<br>Apps Scriptで setup を実行済みか確認してください。</div></div>';
  });
</script>
</body>
